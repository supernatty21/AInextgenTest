name: Next.js WHA App Starter CI
on:
  push:
    branches: 
      - 'feature-**'
jobs:
  lint-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '24.x'
          cache: 'npm'
      - run: node -v
      - run: npm ci
      - run: npm run lint
